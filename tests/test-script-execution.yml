name: Test Kotlin script execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - id: action
        uses: .
        with:
          version: '2.3.10'
          script: |
            println("Hello from Kotlin script!")
      - name: Assert kotlinc is available after script execution
        run: |
          echo "Checking kotlinc availability..."
          if ! command -v kotlinc > /dev/null 2>&1; then
            echo "FAIL: kotlinc not found in PATH"
            exit 1
          fi
          echo "PASS: kotlinc found at $(command -v kotlinc)"
      - name: Assert script output file was created
        run: |
          echo "Checking that script.main.kts was created by the action..."
          if [ ! -f "script.main.kts" ]; then
            echo "FAIL: script.main.kts was not created"
            exit 1
          fi
          echo "PASS: script.main.kts exists"
          cat script.main.kts
