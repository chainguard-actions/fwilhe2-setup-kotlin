name: Test Kotlin setup with script execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Java is available
        run: |
          if command -v java >/dev/null 2>&1; then
            echo "Java already available"
            java -version 2>&1
          else
            echo "Java not found, installing..."
            sudo apt-get update -qq || apt-get update -qq
            sudo apt-get install -y -qq default-jdk-headless || apt-get install -y -qq default-jdk-headless
            java -version 2>&1
          fi
      - id: setup-kotlin
        uses: .
        with:
          version: '2.2.21'
          install-native: 'false'
          script: |
            val x = 42
            println(x)
      - name: Assert kotlinc is available after script execution
        run: |
          echo "Checking kotlinc availability..."
          if ! command -v kotlinc >/dev/null 2>&1; then
            echo "FAIL: kotlinc not found in PATH"
            exit 1
          fi
          echo "PASS: kotlinc found at $(command -v kotlinc)"
      - name: Assert script file was created
        run: |
          echo "Checking that script.main.kts was created..."
          if [ ! -f "script.main.kts" ]; then
            echo "FAIL: script.main.kts was not created"
            exit 1
          fi
          echo "PASS: script.main.kts exists"
          cat script.main.kts
      - name: Assert script content is correct
        run: |
          CONTENT=$(cat script.main.kts)
          echo "Script content: $CONTENT"
          if echo "$CONTENT" | grep -q 'val x = 42'; then
            echo "PASS: script content is correct"
          else
            echo "FAIL: script content does not match expected"
            exit 1
          fi
